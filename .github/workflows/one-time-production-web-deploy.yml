name: One-time production web deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-production-web-deploy.yml

permissions:
  contents: read

concurrency:
  group: fleurstales-production
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Storefront to Vercel production
        working-directory: apps/storefront
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STOREFRONT_PROJECT_ID }}
        run: npx -y vercel@59.11.2 deploy --prod --yes --project "$VERCEL_PROJECT_ID" -T "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
      - name: Deploy Business OS to Vercel production
        working-directory: apps/os
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_OS_PROJECT_ID }}
        run: npx -y vercel@59.11.2 deploy --prod --yes --project "$VERCEL_PROJECT_ID" -T "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

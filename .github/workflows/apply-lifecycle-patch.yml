name: Apply lifecycle patch

on:
  push:
    branches:
      - hotfix/canonical-storefront-tracking-url

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, '[apply-lifecycle-patch]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/canonical-storefront-tracking-url
          fetch-depth: 0

      - name: Reconstruct and apply lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/orderlifecycle.gz.b64.part* | base64 -d > /tmp/orderlifecycle.patch.gz
          echo "6d18bd976778c7393950ebdd37b4047c6e4bb8591b226b96c5de49991d611095  /tmp/orderlifecycle.patch.gz" | sha256sum -c -
          gunzip -c /tmp/orderlifecycle.patch.gz > /tmp/orderlifecycle.patch
          echo "80c474087f62c00dedd18128ba779b088894fd2253a689b972face682cdf01eb  /tmp/orderlifecycle.patch" | sha256sum -c -
          git apply --check /tmp/orderlifecycle.patch
          git apply /tmp/orderlifecycle.patch
          rm -rf .github/patches
          rm -f .github/workflows/apply-lifecycle-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add order lifecycle progress UX"
          git push origin HEAD:hotfix/canonical-storefront-tracking-url

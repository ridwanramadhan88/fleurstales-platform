name: Release production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleurstales-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  database-preflight:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay all migrations and smoke tests on disposable Supabase
        run: ./scripts/run-local-supabase-database-gate.sh

  migrate:
    needs: database-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npx -y supabase@2.109.1 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview production migration plan
        run: npx -y supabase@2.109.1 db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --dry-run
      - name: Apply production migrations
        run: npx -y supabase@2.109.1 db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes
      - name: Lint live Supabase schema
        run: npx -y supabase@2.109.1 db lint --linked --schema public --level error --fail-on error
      - name: Run every live Fleurstales database smoke test
        run: ./scripts/run-supabase-smoke-tests.sh "$SUPABASE_DB_URL"

  deploy-functions:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y supabase@2.109.1 functions deploy staff-admin --project-ref "$SUPABASE_PROJECT_ID"
      - run: npx -y supabase@2.109.1 functions deploy staff-login --project-ref "$SUPABASE_PROJECT_ID"

  deploy-storefront:
    needs: deploy-functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STOREFRONT_PROJECT_ID }}
      FLEURSTALES_SUPABASE_URL: ${{ secrets.FLEURSTALES_SUPABASE_URL }}
      FLEURSTALES_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FLEURSTALES_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -y vercel@56.5.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --cwd apps/storefront
      - run: npx -y vercel@56.5.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}" --cwd apps/storefront
      - run: npx -y vercel@56.5.0 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" --cwd apps/storefront

  deploy-os:
    needs: deploy-functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_OS_PROJECT_ID }}
      FLEURSTALES_SUPABASE_URL: ${{ secrets.FLEURSTALES_SUPABASE_URL }}
      FLEURSTALES_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FLEURSTALES_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -y vercel@56.5.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --cwd apps/os
      - run: npx -y vercel@56.5.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}" --cwd apps/os
      - run: npx -y vercel@56.5.0 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" --cwd apps/os

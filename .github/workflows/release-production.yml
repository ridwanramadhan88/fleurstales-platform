name: Release production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  statuses: write

concurrency:
  group: fleurstales-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  database-preflight:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay all migrations and smoke tests on disposable Supabase
        run: ./scripts/run-local-supabase-database-gate.sh

  migrate:
    needs: database-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npx -y supabase@2.109.1 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview production migration plan
        run: npx -y supabase@2.109.1 db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --dry-run
      - name: Apply production migrations
        run: npx -y supabase@2.109.1 db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes
      - name: Lint live Supabase schema
        run: npx -y supabase@2.109.1 db lint --linked --schema public --level error --fail-on error
      - name: Run every live Fleurstales database smoke test
        run: ./scripts/run-supabase-smoke-tests.sh "$SUPABASE_DB_URL"

  deploy-functions:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y supabase@2.109.1 functions deploy staff-admin --project-ref "$SUPABASE_PROJECT_ID"
      - run: npx -y supabase@2.109.1 functions deploy staff-login --project-ref "$SUPABASE_PROJECT_ID"
      - name: Notify Vercel OS production release
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - fleurstales-os: production-release"
      - name: Notify Vercel Storefront production release
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - fleurstales-storefront: production-release"

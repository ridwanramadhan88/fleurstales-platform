name: Release staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleurstales-staging
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  database-preflight:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay all migrations and smoke tests on disposable Supabase
        run: ./scripts/run-local-supabase-database-gate.sh

  migrate-and-test-staging:
    needs: database-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npx -y supabase@2.109.1 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview staging migration plan
        run: npx -y supabase@2.109.1 db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --dry-run
      - name: Apply staging migrations
        run: npx -y supabase@2.109.1 db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes
      - name: Lint staging schema
        run: npx -y supabase@2.109.1 db lint --linked --schema public --level error --fail-on error
      - name: Run every staging database smoke test
        run: ./scripts/run-supabase-smoke-tests.sh "$SUPABASE_DB_URL"
      - name: Deploy staging staff functions after database verification
        run: |
          npx -y supabase@2.109.1 functions deploy staff-admin --project-ref "$SUPABASE_PROJECT_ID"
          npx -y supabase@2.109.1 functions deploy staff-login --project-ref "$SUPABASE_PROJECT_ID"

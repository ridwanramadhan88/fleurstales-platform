name: Deploy OS hotfix

on:
  push:
    branches: [ops/deploy-hr-hydration-hotfix]

permissions:
  contents: read

concurrency:
  group: fleurstales-production
  cancel-in-progress: false

jobs:
  deploy-os:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_OS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Business OS hotfix to Vercel production
        working-directory: apps/os
        run: npx -y vercel@59.11.2 deploy --prod --yes --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"

name: Apply lifecycle patch v2

on:
  push:
    branches:
      - hotfix/canonical-storefront-tracking-url

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, '[apply-lifecycle-patch-v2]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/canonical-storefront-tracking-url
          fetch-depth: 0

      - name: Inspect staged patch chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          allowed = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\n\r')
          for path in sorted(Path('.github/patches').glob('orderlifecycle.gz.b64.part*')):
              data = path.read_text()
              bad = [(i, repr(ch), ord(ch)) for i, ch in enumerate(data) if ch not in allowed]
              print(path.name, 'length=', len(data), 'invalid=', bad[:20])
          PY
          exit 1

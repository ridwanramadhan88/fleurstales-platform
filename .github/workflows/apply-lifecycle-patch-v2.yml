name: Apply lifecycle patch v2

on:
  push:
    branches:
      - hotfix/canonical-storefront-tracking-url

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, '[apply-lifecycle-patch-v2]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/canonical-storefront-tracking-url
          fetch-depth: 0

      - name: Repair payload and apply lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          part_paths = [Path(f'.github/patches/orderlifecycle.gz.b64.part0{i}') for i in range(4)]
          parts = [path.read_text() for path in part_paths]
          target = '6d18bd976778c7393950ebdd37b4047c6e4bb8591b226b96c5de49991d611095'
          suspect = parts[1]
          prefix = parts[0]
          suffix = parts[2] + parts[3]
          fixed = None
          for i in range(len(suspect)):
              candidate_text = prefix + suspect[:i] + suspect[i+1:] + suffix
              try:
                  raw = base64.b64decode(candidate_text, validate=True)
              except Exception:
                  continue
              if hashlib.sha256(raw).hexdigest() == target:
                  fixed = suspect[:i] + suspect[i+1:]
                  print(f'Repaired part01 at index {i}.')
                  break
          if fixed is None:
              raise SystemExit('Could not repair lifecycle payload.')
          part_paths[1].write_text(fixed)
          full = parts[0] + fixed + parts[2] + parts[3]
          raw = base64.b64decode(full, validate=True)
          if hashlib.sha256(raw).hexdigest() != target:
              raise SystemExit('Reconstructed gzip checksum mismatch.')
          Path('/tmp/orderlifecycle.patch.gz').write_bytes(raw)
          PY
          gzip -dc /tmp/orderlifecycle.patch.gz > /tmp/orderlifecycle.patch
          echo '80c474087f62c00dedd18128ba779b088894fd2253a689b972face682cdf01eb  /tmp/orderlifecycle.patch' | sha256sum -c -
          git apply --check /tmp/orderlifecycle.patch
          git apply /tmp/orderlifecycle.patch

          rm -f .github/patches/orderlifecycle.gz.b64.part00 \
                .github/patches/orderlifecycle.gz.b64.part01 \
                .github/patches/orderlifecycle.gz.b64.part02 \
                .github/patches/orderlifecycle.gz.b64.part03 \
                .github/patches/orderlifecycle.patch \
                .github/workflows/apply-lifecycle-patch.yml \
                .github/workflows/apply-lifecycle-patch-v2.yml
          rmdir .github/patches 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate order lifecycle progress UX'
          git push origin HEAD:hotfix/canonical-storefront-tracking-url

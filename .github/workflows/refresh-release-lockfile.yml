name: Refresh release lockfile

on:
  push:
    branches:
      - hotfix/release-safety-revision-storm
    paths:
      - .github/workflows/refresh-release-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/release-safety-revision-storm
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-release-lockfile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/refresh-release-lockfile.yml
          git commit -m 'chore: refresh lockfile for Vercel functions'
          git push origin HEAD:hotfix/release-safety-revision-storm

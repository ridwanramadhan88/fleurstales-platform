name: One-shot fix OS Vercel routing

on:
  push:
    branches:
      - ops/fix-vercel-os-routing

permissions:
  contents: read

jobs:
  fix-vercel-routing:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disable Vercel Authentication for Fleurstales OS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN}" || { echo 'VERCEL_TOKEN is unavailable in the production environment.' >&2; exit 1; }
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' \
            --request PATCH \
            'https://api.vercel.com/v9/projects/prj_DCJttzhnZ7nQoEZHnrttEwwACdKd?teamId=team_2XDHF8xiGHAuhTfdS6LkGlnC' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"ssoProtection":null}')"
          cat "$body_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Vercel project update failed with HTTP ${status}" >&2
            exit 1
          fi

      - name: Point public OS alias at verified production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' \
            --request POST \
            'https://api.vercel.com/v2/deployments/dpl_EBSgMs2X5oWb86dY591Z2H63hiez/aliases?teamId=team_2XDHF8xiGHAuhTfdS6LkGlnC' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"alias":"fleurstales-os.vercel.app","redirect":null}')"
          cat "$body_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Vercel alias assignment failed with HTTP ${status}" >&2
            exit 1
          fi

      - name: Verify public OS URL no longer serves legacy prototype
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            html_file="$(mktemp)"
            status="$(curl --silent --show-error --location --output "$html_file" --write-out '%{http_code}' 'https://fleurstales-os.vercel.app/')"
            if [ "$status" = "200" ] \
              && ! grep -q 'Local prototype automatically uses the local SQLite backend' "$html_file" \
              && ! grep -q '<script src="main.js"></script>' "$html_file"; then
              echo "Public OS alias is serving the current deployment."
              exit 0
            fi
            echo "Attempt ${attempt}: alias not updated yet (HTTP ${status}); retrying..."
            sleep 5
          done
          echo 'Public OS alias is still serving the legacy/protected deployment.' >&2
          exit 1
